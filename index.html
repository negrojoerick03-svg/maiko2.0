
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maiko's Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101828, #174b6b);
      text-align: center;
      padding: 24px;
    }
    main { max-width: 600px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); }
    p { font-size: 1.2rem; line-height: 1.7; color: #d6e5f5; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      border-radius: 10px;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Maiko's Website!</h1>
    <p>Your website is online and working.</p>
    <a href="https://netlify.com">Powered by Netlify</a>
  </main>
</body>
</html>
